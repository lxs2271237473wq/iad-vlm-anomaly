<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="560" viewBox="0 0 1320 560">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#222222"/>
</marker>
</defs>
<rect x="0" y="0" width="1320" height="560" fill="#ffffff"/>
<text x="660" y="36" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Quality-Calibrated Localization-Guided VLM Reasoning</text>
<text x="660" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Detector localization -&gt; candidate crop -&gt; VLM evidence -&gt; candidate quality calibration -&gt; adaptive refinement</text>
<rect x="40" y="150" width="150" height="78" rx="12" ry="12" fill="#f7f7f7" stroke="#222222" stroke-width="1.4"/>
<text x="115" y="178" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Input image</text>
<text x="115" y="202" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">x</text>
<rect x="230" y="150" width="180" height="78" rx="12" ry="12" fill="#f7f7f7" stroke="#222222" stroke-width="1.4"/>
<text x="320" y="178" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Detector</text>
<text x="320" y="202" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">A, D</text>
<rect x="455" y="150" width="180" height="78" rx="12" ry="12" fill="#f7f7f7" stroke="#222222" stroke-width="1.4"/>
<text x="545" y="178" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Candidate crops</text>
<text x="545" y="202" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">C = {c_i}</text>
<rect x="680" y="150" width="190" height="78" rx="12" ry="12" fill="#f7f7f7" stroke="#222222" stroke-width="1.4"/>
<text x="775" y="178" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Crop VLM scoring</text>
<text x="775" y="202" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">M</text>
<rect x="915" y="150" width="190" height="78" rx="12" ry="12" fill="#f0f0f0" stroke="#222222" stroke-width="1.4"/>
<text x="1010" y="178" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Quality calibration</text>
<text x="1010" y="202" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Q modulates M</text>
<rect x="1135" y="150" width="160" height="78" rx="12" ry="12" fill="#f0f0f0" stroke="#222222" stroke-width="1.4"/>
<text x="1215" y="178" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Image score</text>
<text x="1215" y="202" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">S_quality</text>
<line x1="190" y1="189" x2="230" y2="189" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="410" y1="189" x2="455" y2="189" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="635" y1="189" x2="680" y2="189" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="870" y1="189" x2="915" y2="189" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="1105" y1="189" x2="1135" y2="189" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="915" y="315" width="190" height="86" rx="12" ry="12" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="1010" y="343" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Adaptive consistency</text>
<text x="1010" y="367" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">g = QK(1-|D-M|)min(D,M)</text>
<line x1="1010" y1="228" x2="1010" y2="315" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="1105" y1="358" x2="1215" y2="228" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1050" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Conservative refinement; not main performance source</text>
<rect x="680" y="315" width="190" height="86" rx="12" ry="12" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="775" y="343" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Fixed Q+C</text>
<text x="775" y="367" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">diagnostic only</text>
<line x1="775" y1="228" x2="775" y2="315" stroke="#222222" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
<text x="775" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Not final method; robustness insufficient</text>
<text x="330" y="270" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Detector evidence is used as localization guidance</text>
<text x="760" y="270" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">VLM evidence is localized but must be calibrated</text>
<text x="1010" y="270" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Candidate quality is the main reliable component</text>
</svg>