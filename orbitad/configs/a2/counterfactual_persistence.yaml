experiment:
  name: a2_1_counterfactual_persistence
  seed: 20260913

model:
  name: vit_base_patch16_dinov3.lvd1689m
  input_size: 512
  frozen: true

orbit:
  states:
    - original
    - gradient_45
    - gradient_135
    - spotlight
    - shadow
    - lowfreq_g8_a10

  gradient:
    amplitude: 0.30

  spotlight:
    amplitude: 0.30
    center_x: -0.35
    center_y: 0.20
    sigma_fraction: 0.30

  shadow:
    amplitude: 0.30
    center_x: 0.35
    center_y: -0.20
    sigma_fraction: 0.30

  lowfreq:
    grid_size: 8
    amplitude: 0.10

aggregation:
  methods:
    - original
    - mean
    - median
    - q25
    - min
    - spr

evaluation:
  resolution: 512
  aupro_max_fpr: 0.05
  validation_threshold_quantile: 0.995

protocol:
  validation_only_for_thresholds: true
  public_gt_for_thresholds: false
  orbit_parameters_frozen: true

output:
  root: orbitad/results/a2_counterfactual_persistence
